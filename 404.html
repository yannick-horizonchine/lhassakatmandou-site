<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Lhassa–Katmandou à vélo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@300;400;500&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#ffffff; --ink-soft:rgba(255,255,255,.82); --gold:#DFA22E; --bg:#0D1420;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; min-height:100%; display:flex; align-items:center;
    background:var(--bg) url("/images/photo-11.jpg") center/cover no-repeat;
    color:var(--ink); font-family:'Noto Sans SC',sans-serif; font-weight:300; line-height:1.8; -webkit-font-smoothing:antialiased;}
  body::before{content:""; position:fixed; inset:0; background:linear-gradient(0deg,rgba(6,10,16,.88) 0%,rgba(6,10,16,.5) 60%,rgba(6,10,16,.65) 100%);}
  main{position:relative; max-width:640px; margin:0 auto; padding:48px 24px;}
  .brand{display:flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none;}
  .brand img{width:34px; height:34px; object-fit:contain;}
  .brand b{display:block; font-family:'Noto Serif SC',serif; font-weight:900; font-size:17px; line-height:1.2;}
  .brand small{display:block; font-family:'Inter',sans-serif; font-size:9px; letter-spacing:.18em; color:var(--ink-soft);}
  .eyebrow{display:block; margin-top:48px; font-family:'Inter',sans-serif; font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:#BFD6F2; font-weight:600;}
  h1{font-family:'Noto Serif SC',serif; font-weight:700; font-size:clamp(30px,7vw,48px); line-height:1.2; margin:.4em 0 .4em; text-wrap:balance;}
  p{color:var(--ink-soft); font-size:17px; margin:0 0 2em;}
  .btn{display:inline-block; background:#fff; color:#16233B; text-decoration:none; font-weight:500; padding:14px 26px; border-radius:3px;}
  .btn:hover{background:var(--gold);}
  .lang{margin-top:40px; font-size:14px; color:var(--ink-soft);}
  .lang a{color:var(--ink);}
  .lang .cur{color:var(--gold); font-weight:500;}
</style>
</head>
<body>
<main>
  <a href="/" class="brand"><img src="/images/logo.png?v=2" alt=""><span><b>Lost Horizon</b><small>LHASSA → KATMANDOU</small></span></a>
  <span class="eyebrow">Erreur 404</span>
  <h1>Ce sentier ne mène nulle part.</h1>
  <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
  <a href="/" class="btn">Retour à l'accueil</a>
  <div class="lang"><span class="cur">FR</span> · <a href="/en/">EN</a></div>
</main>
</body>
</html>
